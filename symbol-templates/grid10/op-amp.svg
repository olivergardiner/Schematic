<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-40 -40 80 80">
  <!-- Terminals: in+ (-30,-10), in- (-30,10), out (30,0),
       v+ (0,-20), v- (0,20). Supply leads meet the triangle at y=+/-10. -->
  <g stroke="#000000" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <polygon points="-20,-20 -20,20 20,0" fill="#ffffff"/>
    <line x1="-30" y1="-10" x2="-20" y2="-10"/>
    <line x1="-30" y1="10" x2="-20" y2="10"/>
    <line x1="20" y1="0" x2="30" y2="0"/>
    <line x1="0" y1="-20" x2="0" y2="-10"/>
    <line x1="0" y1="10" x2="0" y2="20"/>
    <line x1="-16" y1="-10" x2="-12" y2="-10"/>
    <line x1="-14" y1="-12" x2="-14" y2="-8"/>
    <line x1="-16" y1="10" x2="-12" y2="10"/>
  </g>
</svg>
