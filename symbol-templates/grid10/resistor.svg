<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40" viewBox="-30 -20 60 40">
  <!-- One SVG user unit = one scene unit. Terminals: (-20,0), (20,0). -->
  <g stroke="#000000" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="-10" y="-5" width="20" height="10" fill="#ffffff"/>
    <line x1="-20" y1="0" x2="-10" y2="0"/>
    <line x1="10" y1="0" x2="20" y2="0"/>
  </g>
</svg>
