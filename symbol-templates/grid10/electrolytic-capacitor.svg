<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40" viewBox="-30 -20 60 40">
  <!-- Positive terminal: (-20,0), hollow plate. Negative: (20,0), black plate.
       Plate boxes are 3 x 20 units, with a 4-unit gap. -->
  <g stroke="#000000" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <line x1="-20" y1="0" x2="-5" y2="0"/>
    <line x1="5" y1="0" x2="20" y2="0"/>
    <rect x="-5" y="-10" width="3" height="20" fill="white"/>
    <rect x="2" y="-10" width="3" height="20" fill="black"/>
    <line x1="-13" y1="-14" x2="-9" y2="-14"/>
    <line x1="-11" y1="-16" x2="-11" y2="-12"/>
  </g>
</svg>
